<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main">
      {% assign p = page.url %}
      <a href="{{ '/blog/' | relative_url }}" {% if p contains '/blog/' or page.layout == 'post' %}aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/notes/' | relative_url }}" {% if p contains '/notes/' %}aria-current="page"{% endif %}>Notes</a>
      <a href="{{ '/archive/' | relative_url }}" {% if p contains '/archive/' %}aria-current="page"{% endif %}>Archive</a>
      <a href="{{ '/about/' | relative_url }}" {% if p contains '/about/' %}aria-current="page"{% endif %}>About</a>
      <a class="btn-subscribe" href="{{ '/subscribe/' | relative_url }}">Subscribe</a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>
      </button>
    </nav>
  </div>
</header>
